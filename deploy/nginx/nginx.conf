worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Docker 内置 DNS。用变量解析服务名，服务端容器重建后不必重载 Nginx。
    # 127.0.0.11 是 Docker 桥接网络的解析器，不是家庭地址。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        # S02 的 H5 壳。带哈希的静态资源可以长期缓存，入口页不缓存。
        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # /api/ 原样转到服务端 /api/，不重复前缀，也不截掉 v1。
        location /api/ {
            set $api_upstream server:8080;
            proxy_http_version 1.1;
            proxy_pass http://$api_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 课程素材。目录只读挂载；这里再关掉目录列表。
        location /media/ {
            alias /data/media/;
            autoindex off;
            disable_symlinks on;
            add_header Cache-Control "public, max-age=3600";
        }

        location ~ /\. {
            deny all;
        }
    }
}
